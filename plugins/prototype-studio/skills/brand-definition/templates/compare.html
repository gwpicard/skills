<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparison</title>
<!--
  One review page for a round of options. Copy this file next to the option images or pages,
  edit the ROUND block below, and open it in a browser (no server needed).

  Each option: { "id": "L2", "label": "Clean", "src": "l2.png" | "l2.html", "note": "..." }
  An .html src is shown in an iframe at the stated width; anything else as an image.
  Keys: G grid · 1–9 focus an option · ←/→ step · P pick · Esc back to grid.
  "Copy decisions" puts the picks and notes on the clipboard as Markdown, ready to paste back
  to the agent. Picks and notes are kept in this browser only.
-->
<script type="application/json" id="round">
{
  "title": "Round 1 · Line quality",
  "question": "Which line level should the brand use?",
  "fixed": "Same five subjects, same palette, light background, 160 px",
  "varies": "Line texture, from clean (L0) to textured (L3)",
  "frameWidth": 1440,
  "options": [
    { "id": "L0", "label": "Current", "src": "l0.png", "note": "Constant width, no taper." },
    { "id": "L1", "label": "Calm", "src": "l1.png", "note": "Slight taper at ends." },
    { "id": "L2", "label": "Clean", "src": "l2.png", "note": "Taper and overshoot, no hatching." },
    { "id": "L3", "label": "Technical", "src": "l3.png", "note": "Full hatching and double passes." }
  ]
}
</script>
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --ink: #1b1b1a; --muted: #62615d; --line: #d9d8d3;
  --pick: #1f5fd1; --pick-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1e; --ink: #ecebe7; --muted: #a3a29d; --line: #3a3a37;
    --pick: #7aa7ff; --pick-ink: #0d1626;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1e; --ink: #ecebe7; --muted: #a3a29d; --line: #3a3a37;
  --pick: #7aa7ff; --pick-ink: #0d1626;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 12px; max-width: 1600px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.meta { color: var(--muted); margin: 0; }
.meta b { color: var(--ink); font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--pick); color: var(--pick-ink); border-color: var(--pick); }
.status { color: var(--muted); font-size: 13px; }
main { max-width: 1600px; margin: 0 auto; padding: 0 16px 48px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.card.picked { border-color: var(--pick); box-shadow: 0 0 0 2px var(--pick); }
.frame { position: relative; background: var(--bg); cursor: zoom-in; overflow: hidden; }
.frame img { display: block; width: 100%; height: auto; }
.frame .scaler { position: relative; width: 100%; overflow: hidden; }
.frame iframe { border: 0; transform-origin: 0 0; position: absolute; top: 0; left: 0; pointer-events: none; }
.focus .frame { cursor: default; }
.focus .frame iframe { pointer-events: auto; }
.body { padding: 12px; display: grid; gap: 8px; }
.title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.title strong { font-weight: 600; }
.note { color: var(--muted); margin: 0; font-size: 14px; }
textarea { width: 100%; min-height: 56px; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.focus { display: none; }
body.is-focus .grid { display: none; }
body.is-focus .focus { display: block; }
.focus .card { max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1 id="t"></h1>
  <p class="meta" id="q"></p>
  <p class="meta"><b>Fixed:</b> <span id="fixed"></span> · <b>Varies:</b> <span id="varies"></span></p>
  <div class="bar">
    <button id="gridBtn" type="button">Grid (G)</button>
    <button id="copyBtn" type="button">Copy decisions</button>
    <button id="themeBtn" type="button">Theme</button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="focus" id="focus"></div>
</main>
<script>
const R = JSON.parse(document.getElementById('round').textContent);
const KEY = 'compare:' + R.title;
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
};
let state = Object.assign({ picks: [], notes: {} }, store.get());
let focused = -1;
const $ = id => document.getElementById(id);
$('t').textContent = R.title; $('q').textContent = R.question || '';
$('fixed').textContent = R.fixed || '—'; $('varies').textContent = R.varies || '—';

function frame(o) {
  const f = document.createElement('div'); f.className = 'frame';
  if (/\.html?(\?|#|$)/.test(o.src)) {
    const sc = document.createElement('div'); sc.className = 'scaler';
    const ifr = document.createElement('iframe'); ifr.src = o.src; ifr.title = o.label;
    const W = R.frameWidth || 1440, H = Math.round(W * 0.625);
    ifr.width = W; ifr.height = H;
    sc.appendChild(ifr); f.appendChild(sc);
    const fit = () => { const k = sc.clientWidth / W; ifr.style.transform = `scale(${k})`; sc.style.height = H * k + 'px'; };
    new ResizeObserver(fit).observe(sc);
  } else {
    const img = document.createElement('img'); img.src = o.src; img.alt = `${o.id}: ${o.label}`; img.loading = 'lazy';
    f.appendChild(img);
  }
  return f;
}
function card(o, i) {
  const c = document.createElement('article'); c.className = 'card' + (state.picks.includes(o.id) ? ' picked' : '');
  const f = frame(o); f.addEventListener('click', () => { if (focused < 0) show(i); });
  const b = document.createElement('div'); b.className = 'body';
  b.innerHTML = `<div class="title"><strong>${i + 1} · ${o.id} — ${o.label}</strong></div><p class="note"></p>`;
  b.querySelector('.note').textContent = o.note || '';
  const pick = document.createElement('button'); pick.type = 'button';
  pick.setAttribute('aria-pressed', state.picks.includes(o.id)); pick.textContent = state.picks.includes(o.id) ? 'Picked' : 'Pick (P)';
  pick.addEventListener('click', () => toggle(o.id));
  b.querySelector('.title').appendChild(pick);
  const ta = document.createElement('textarea'); ta.placeholder = 'What works, what does not'; ta.value = state.notes[o.id] || '';
  ta.setAttribute('aria-label', `Notes on ${o.id}`);
  ta.addEventListener('input', () => { state.notes[o.id] = ta.value; store.set(state); });
  b.appendChild(ta);
  c.append(f, b); return c;
}
function render() {
  $('grid').replaceChildren(...R.options.map(card));
  if (focused >= 0) $('focus').replaceChildren(card(R.options[focused], focused));
  document.body.classList.toggle('is-focus', focused >= 0);
  $('status').textContent = state.picks.length ? `Picked: ${state.picks.join(', ')}` : 'Nothing picked yet';
}
function toggle(id) {
  state.picks = state.picks.includes(id) ? state.picks.filter(p => p !== id) : [...state.picks, id];
  store.set(state); render();
}
function show(i) { focused = i; render(); }
$('gridBtn').addEventListener('click', () => { focused = -1; render(); });
$('themeBtn').addEventListener('click', () => {
  const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  d.dataset.theme = dark ? 'light' : 'dark';
});
$('copyBtn').addEventListener('click', async () => {
  const lines = [`## ${R.title}`, R.question ? `Question: ${R.question}` : '', `Picked: ${state.picks.join(', ') || 'none'}`, ''];
  for (const o of R.options) if (state.notes[o.id]) lines.push(`- ${o.id} (${o.label}): ${state.notes[o.id]}`);
  const md = lines.filter((l, i) => l || i === 3).join('\n');
  try { await navigator.clipboard.writeText(md); $('status').textContent = 'Copied. Paste it back to the agent.'; }
  catch { $('status').textContent = 'Copy failed; select the notes manually.'; }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  const n = +e.key;
  if (n >= 1 && n <= R.options.length) show(n - 1);
  else if (e.key === 'g' || e.key === 'G' || e.key === 'Escape') { focused = -1; render(); }
  else if (e.key === 'ArrowRight' && focused >= 0) show((focused + 1) % R.options.length);
  else if (e.key === 'ArrowLeft' && focused >= 0) show((focused - 1 + R.options.length) % R.options.length);
  else if ((e.key === 'p' || e.key === 'P') && focused >= 0) toggle(R.options[focused].id);
});
render();
</script>
</body>
</html>
